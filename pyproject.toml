[project]
name = "mlfs"
version = "0.1.0"
description = "Linear regression, a biological neuron and a neural network, built from first principles in NumPy."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emilio Gappa" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "scikit-learn>=1.4", "scipy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlfs"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
